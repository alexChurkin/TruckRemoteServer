name: Build

on:
  push:
    # Work branches of the assistant are built too: the Windows window can be checked only in CI
    branches: [ master, 'claude/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build TruckRemoteServer.sln -c Release -warnaserror:CS0168,CS0219,CS0162

      - name: Test
        run: dotnet test tests/TruckRemoteServer.Tests/TruckRemoteServer.Tests.csproj -c Release --no-build

      # The program is a single exe (references, translations, vJoy library and the telemetry plugin are embedded)
      - uses: actions/upload-artifact@v6
        with:
          name: TruckRemoteServer
          path: |
            src/TruckRemoteServer/bin/Release/TruckRemoteServer.exe
            src/TruckRemoteServer/bin/Release/THIRD-PARTY-NOTICES.txt

      # Smoke test of the window on a clean Windows and its look for reviews
      - name: Screenshots
        run: ./.github/scripts/screenshots.ps1 -Exe "${{ github.workspace }}\src\TruckRemoteServer\bin\Release\TruckRemoteServer.exe" -Out screenshots
        shell: pwsh

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
