name: Build

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build TruckRemoteServer.sln -c Release -warnaserror:CS0168,CS0219,CS0162

      - name: Test
        run: dotnet test Tests/TruckRemoteServer.Tests.csproj -c Release --no-build

      - uses: actions/upload-artifact@v6
        with:
          name: TruckRemoteServer
          path: bin/Release/
